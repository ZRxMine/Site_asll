<!DOCTYPE html>
<html>
<head><style>body { margin: 0; background: #111; overflow: hidden; } #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: red; border-radius: 50%; transform: translate(-50%, -50%); }</style></head>
<body>
    <div id="crosshair"></div>
    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.158.0/build/three.module.js';
        import { PointerLockControls } from 'https://unpkg.com/three@0.158.0/examples/jsm/controls/PointerLockControls.js';

        // 1. Core Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Weapon (The Viewmodel)
        const gun = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.5), new THREE.MeshBasicMaterial({ color: 0x555555 }));
        gun.position.set(0.2, -0.2, -0.4); // Positioned bottom right
        camera.add(gun); // Attach gun to camera so it moves with view
        scene.add(camera);

        // 3. Map (Simple Obstacles)
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshBasicMaterial({ color: 0x444444 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // Create some enemies (Targets)
        const enemies = [];
        for(let i = 0; i < 5; i++) {
            const enemy = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
            enemy.position.set(Math.random()*20-10, 1, Math.random()*20-10);
            scene.add(enemy);
            enemies.push(enemy);
        }

        // 4. Controls & Shooting
        const controls = new PointerLockControls(camera, document.body);
        const raycaster = new THREE.Raycaster();
        
        document.addEventListener('click', () => {
            if(!controls.isLocked) { controls.lock(); return; }
            
            // SHOOT LOGIC
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); // Center of screen
            const intersects = raycaster.intersectObjects(enemies);
            
            if(intersects.length > 0) {
                scene.remove(intersects[0].object); // Remove enemy on hit
                console.log("Enemy Down!");
            }
        });

        camera.position.set(0, 1.6, 5);
        
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
